services:

  mathmind-ai:

    build:
      context: .

    container_name: mathmind-ai

    ports:
      - "8501:8501"

    env_file:
      - .env

    restart: unless-stopped

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true